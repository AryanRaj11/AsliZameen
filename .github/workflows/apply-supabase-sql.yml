name: Apply Supabase SQL migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/sql/**"

jobs:
  apply-sql:
    runs-on: ubuntu-latest

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Supabase DB URL is set
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not set. Please add it as a GitHub secret."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Force IPv4 connection (work around IPv6 runner networking)
        run: |
          set -e

          python - <<'PY'
          import os, sys
          from urllib.parse import urlparse

          u = os.environ.get("SUPABASE_DB_URL", "")
          if not u:
            print("SUPABASE_DB_URL missing", file=sys.stderr)
            sys.exit(1)

          p = urlparse(u)
          if not p.hostname:
            print("Could not parse hostname from SUPABASE_DB_URL", file=sys.stderr)
            sys.exit(1)

          # Export as GitHub Actions env vars
          with open(os.environ["GITHUB_ENV"], "a") as f:
            f.write(f"DB_HOST={p.hostname}\n")
            f.write(f"DB_PORT={p.port or 5432}\n")
            f.write(f"DB_NAME={(p.path or '/').lstrip('/')}\n")
            f.write(f"DB_USER={(p.username or '')}\n")
            f.write(f"DB_PASS={(p.password or '')}\n")
          PY

          DB_HOSTADDR="$(getent ahostsv4 "$DB_HOST" | awk '{print $1; exit}')"
          if [ -z "$DB_HOSTADDR" ]; then
            echo "Could not resolve IPv4 address for $DB_HOST"
            exit 1
          fi

          echo "DB_HOSTADDR=$DB_HOSTADDR" >> "$GITHUB_ENV"

      - name: Apply SQL files to Supabase
        run: |
          set -e
          echo "Applying SQL files in supabase/sql to Supabase database..."

          for file in $(ls supabase/sql/*.sql | sort); do
            echo "Running $file"
            PGPASSWORD="$DB_PASS" \
              psql "host=$DB_HOST hostaddr=$DB_HOSTADDR port=$DB_PORT dbname=$DB_NAME user=$DB_USER sslmode=require" \
              -v ON_ERROR_STOP=1 \
              -f "$file"
          done
