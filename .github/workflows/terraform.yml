name: Supabase Infra Pipeline

on:
  workflow dispatch:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      # Project URL (replace if you ever change project ref)
      SUPABASE_URL: https://udypjslvtmthdeodzpev.supabase.co
      # Provide the service role key in GitHub Secrets as SUPABASE_SERVICE_ROLE_KEY
      TF_VAR_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        # Show plan only for PRs or non-main pushes
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan